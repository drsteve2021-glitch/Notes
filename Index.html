<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f4ef;
    --card: #fffdf9;
    --ink: #1f2430;
    --ink-soft: #6b7280;
    --line: #e6e2d8;
    --accent: #2f6f7e;
    --accent-soft: #e3efef;
    --amber: #d98b3a;
    --danger: #b4452f;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31,36,48,.05), 0 6px 20px rgba(31,36,48,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.5; min-height: 100vh;
  }
  .hidden { display: none !important; }

  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); width: 100%; max-width: 380px; padding: 36px 30px; }
  .brand { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { color: var(--accent); }
  .auth-card .sub { color: var(--ink-soft); font-size: 14px; margin: 6px 0 26px; }
  label { font-size: 13px; font-weight: 500; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  input[type="text"], input[type="password"], textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field { margin-bottom: 16px; }
  .btn { font-family: inherit; font-size: 15px; font-weight: 600; border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; transition: transform .08s, background .15s, opacity .15s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:hover { background: #275a66; }
  .btn-ghost { background: transparent; color: var(--accent); padding: 8px; }
  .auth-toggle { text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
  .auth-toggle button { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .msg { font-size: 13px; margin-top: 4px; min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 1000px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
  .header-inner .brand { font-size: 22px; }
  .search { flex: 1; position: relative; max-width: 380px; }
  .search input { padding-left: 36px; background: var(--paper); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
  .user-chip { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }

  main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
  .composer { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 30px; }
  .composer input.title-in { border: none; font-size: 18px; font-weight: 600; font-family: 'Fraunces', serif; padding: 4px 4px 8px; background: transparent; }
  .composer input.title-in:focus { box-shadow: none; }
  .composer textarea { border: none; resize: none; padding: 4px; background: transparent; min-height: 46px; }
  .composer textarea:focus { box-shadow: none; }
  .composer-bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .composer-bar .btn-primary { width: auto; }

  .section-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 4px 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 34px; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s; position: relative; }
  .note:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,36,48,.08), 0 14px 30px rgba(31,36,48,.08); }
  .note.pinned { border-color: #eccfa6; }
  .note.pinned::before { content: "Pinned"; position: absolute; top: -9px; left: 14px; background: var(--amber); color: #fff; font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 20px; }
  .note h3 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .note p { font-size: 14px; color: #3d434f; white-space: pre-wrap; word-break: break-word; flex: 1; margin-bottom: 12px; }
  .note .meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .note-actions { display: flex; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; transition: background .12s, color .12s, border-color .12s; }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); border-color: #e6c3ba; background: #fbf1ee; }
  .icon-btn.pin.active { color: var(--amber); border-color: #eccfa6; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty .big { font-family: 'Fraunces', serif; font-size: 22px; color: var(--ink); margin-bottom: 6px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(31,36,48,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); width: 100%; max-width: 480px; padding: 24px; }
  .modal h2 { font-family: 'Fraunces', serif; font-size: 20px; margin-bottom: 18px; }
  .modal .composer-bar { margin-top: 14px; }
  .btn-soft { background: var(--paper); color: var(--ink); }
  .btn-soft:hover { background: #edeae2; }

  @media (max-width: 560px) {
    .header-inner { flex-wrap: wrap; }
    .search { order: 3; max-width: none; flex-basis: 100%; }
  }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">Inkwell<span class="dot">.</span></div>
    <p class="sub" id="authSub">Sign in to reach your notes.</p>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="e.g. prarthana">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="authSubmit" onclick="handleAuth()">Sign in</button>
    <div class="msg" id="authMsg"></div>
    <div class="auth-toggle">
      <span id="toggleText">New here?</span>
      <button id="toggleBtn" onclick="toggleAuthMode()">Create an account</button>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="appScreen" class="hidden">
  <header>
    <div class="header-inner">
      <div class="brand">Inkwell<span class="dot">.</span></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchBox" placeholder="Search notes…" oninput="render()">
      </div>
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <span id="userLabel"></span>
        <button class="btn btn-ghost" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="composer">
      <input type="text" class="title-in" id="newTitle" placeholder="Title">
      <textarea id="newBody" placeholder="Write a note…" oninput="autoGrow(this)"></textarea>
      <div class="composer-bar">
        <button class="btn btn-primary" onclick="addNote()">Add note</button>
      </div>
    </div>

    <div id="pinnedSection" class="hidden">
      <div class="section-label">Pinned</div>
      <div class="grid" id="pinnedGrid"></div>
    </div>

    <div id="othersSection">
      <div class="section-label" id="othersLabel">Notes</div>
      <div class="grid" id="notesGrid"></div>
    </div>

    <div id="emptyState" class="empty hidden">
      <div class="big">No notes yet</div>
      <div>Use the box above to write your first one.</div>
    </div>
  </main>
</div>

<!-- ============ EDIT MODAL ============ -->
<div id="editModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Edit note</h2>
    <div class="field">
      <label for="editTitle">Title</label>
      <input type="text" id="editTitle">
    </div>
    <div class="field">
      <label for="editBody">Note</label>
      <textarea id="editBody" rows="6"></textarea>
    </div>
    <div class="composer-bar">
      <button class="btn btn-soft" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" style="width:auto" onclick="saveEdit()">Save changes</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   INKWELL — a notes app
   Storage:
     localStorage["inkwell_users"] -> { username: passwordHash }
     localStorage["inkwell_notes_<user>"] -> [ note, ... ]
     localStorage["inkwell_session"] -> logged-in username
   note = { id, title, body, pinned, updated }
   ========================================================= */

let authMode = "login";
let currentUser = null;
let notes = [];
let editingId = null;

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return "h" + h;
}

function getUsers() { return JSON.parse(localStorage.getItem("inkwell_users") || "{}"); }
function saveUsers(u) { localStorage.setItem("inkwell_users", JSON.stringify(u)); }
function notesKey(user) { return "inkwell_notes_" + user; }
function loadNotes(user) { return JSON.parse(localStorage.getItem(notesKey(user)) || "[]"); }
function persistNotes() { localStorage.setItem(notesKey(currentUser), JSON.stringify(notes)); }

function toggleAuthMode() {
  authMode = (authMode === "login") ? "register" : "login";
  const isLogin = authMode === "login";
  document.getElementById("authSub").textContent = isLogin ? "Sign in to reach your notes." : "Create an account to start writing.";
  document.getElementById("authSubmit").textContent = isLogin ? "Sign in" : "Create account";
  document.getElementById("toggleText").textContent = isLogin ? "New here?" : "Already have an account?";
  document.getElementById("toggleBtn").textContent = isLogin ? "Create an account" : "Sign in instead";
  document.getElementById("authMsg").textContent = "";
}

function handleAuth() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");
  msg.className = "msg error";
  if (!user || !pass) { msg.textContent = "Enter a username and password."; return; }

  const users = getUsers();
  if (authMode === "register") {
    if (users[user]) { msg.textContent = "That username is taken. Try another."; return; }
    users[user] = hash(pass);
    saveUsers(users);
    startSession(user);
  } else {
    if (!users[user] || users[user] !== hash(pass)) { msg.textContent = "Wrong username or password."; return; }
    startSession(user);
  }
}

function startSession(user) {
  currentUser = user;
  localStorage.setItem("inkwell_session", user);
  notes = loadNotes(user);
  enterApp();
}

function logout() {
  localStorage.removeItem("inkwell_session");
  currentUser = null; notes = [];
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("authMsg").textContent = "";
}

function enterApp() {
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  document.getElementById("userLabel").textContent = currentUser;
  document.getElementById("avatar").textContent = currentUser.charAt(0).toUpperCase();
  render();
}

function addNote() {
  const title = document.getElementById("newTitle").value.trim();
  const body = document.getElementById("newBody").value.trim();
  if (!title && !body) return;
  notes.unshift({ id: Date.now().toString(), title: title || "Untitled", body, pinned: false, updated: Date.now() });
  persistNotes();
  document.getElementById("newTitle").value = "";
  document.getElementById("newBody").value = "";
  document.getElementById("newBody").style.height = "auto";
  render();
}

function deleteNote(id) {
  if (!confirm("Delete this note? This can't be undone.")) return;
  notes = notes.filter(n => n.id !== id);
  persistNotes();
  render();
}

function openEdit(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  editingId = id;
  document.getElementById("editTitle").value = note.title;
  document.getElementById("editBody").value = note.body;
  document.getElementById("editModal").classList.remove("hidden");
}
function closeEdit() { editingId = null; document.getElementById("editModal").classList.add("hidden"); }
function saveEdit() {
  const note = notes.find(n => n.id === editingId);
  if (!note) return;
  note.title = document.getElementById("editTitle").value.trim() || "Untitled";
  note.body = document.getElementById("editBody").value.trim();
  note.updated = Date.now();
  persistNotes();
  closeEdit();
  render();
}

function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.pinned = !note.pinned;
  persistNotes();
  render();
}

function render() {
  const query = document.getElementById("searchBox").value.toLowerCase();
  const visible = notes.filter(n => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query));
  const pinned = visible.filter(n => n.pinned);
  const others = visible.filter(n => !n.pinned);

  document.getElementById("pinnedGrid").innerHTML = pinned.map(noteCard).join("");
  document.getElementById("notesGrid").innerHTML = others.map(noteCard).join("");
  document.getElementById("pinnedSection").classList.toggle("hidden", pinned.length === 0);
  document.getElementById("othersLabel").textContent = pinned.length ? "Others" : "Notes";
  document.getElementById("othersSection").classList.toggle("hidden", others.length === 0);

  const nothing = visible.length === 0;
  document.getElementById("emptyState").classList.toggle("hidden", !nothing);
  if (nothing && query) {
    document.querySelector("#emptyState .big").textContent = "No matches";
    document.querySelector("#emptyState div:last-child").textContent = "Nothing matches “" + query + "”.";
  } else {
    document.querySelector("#emptyState .big").textContent = "No notes yet";
    document.querySelector("#emptyState div:last-child").textContent = "Use the box above to write your first one.";
  }
}

function noteCard(n) {
  return `
    <div class="note ${n.pinned ? 'pinned' : ''}">
      <h3>${escapeHtml(n.title)}</h3>
      ${n.body ? `<p>${escapeHtml(n.body)}</p>` : `<p></p>`}
      <div class="meta">${timeAgo(n.updated)}</div>
      <div class="note-actions">
        <button class="icon-btn pin ${n.pinned ? 'active' : ''}" onclick="togglePin('${n.id}')">${n.pinned ? '★ Pinned' : '☆ Pin'}</button>
        <button class="icon-btn" onclick="openEdit('${n.id}')">✎ Edit</button>
        <button class="icon-btn danger" onclick="deleteNote('${n.id}')">🗑 Delete</button>
      </div>
    </div>`;
}

function escapeHtml(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60); if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60); if (h < 24) return h + " hr ago";
  const d = Math.floor(h / 24); if (d < 7) return d + " day" + (d > 1 ? "s" : "") + " ago";
  return new Date(ts).toLocaleDateString();
}
function autoGrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

(function init() {
  const saved = localStorage.getItem("inkwell_session");
  const users = getUsers();
  if (saved && users[saved]) { currentUser = saved; notes = loadNotes(saved); enterApp(); }
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleAuth(); });
})();
</script>
</body>
</html>
